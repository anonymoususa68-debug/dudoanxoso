<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kết quả xổ số miền Bắc</title>
<style>
  :root {
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-sub: #666;
    --accent: #c0392b;
    --success: #27ae60;
    --warning: #f39c12;
    --border: #e0e0e0;
  }
  
  [data-theme="dark"] {
    --bg: #0f0f1a;
    --card: #1a1a2e;
    --text: #f0f0f0;
    --text-sub: #a0a0b0;
    --accent: #e74c3c;
    --success: #2ecc71;
    --warning: #f1c40f;
    --border: #2a2a3e;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    transition: background 0.3s, color 0.3s;
  }
  
  .container {
    background: var(--card);
    border-radius: 24px;
    padding: 40px 30px;
    max-width: 500px;
    width: 100%;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
    text-align: center;
    position: relative;
  }
  
  .theme-toggle {
    position: absolute;
    top: 15px;
    right: 15px;
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    width: 40px;
    height: 40px;
    cursor: pointer;
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
  }
  
  .theme-toggle:hover {
    background: var(--border);
  }
  
  h1 {
    font-size: 18px;
    font-weight: 500;
    color: var(--text-sub);
    margin-bottom: 30px;
    letter-spacing: 2px;
    text-transform: uppercase;
  }
  
  .numbers {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
  }
  
  .number {
    font-size: 72px;
    font-weight: 800;
    color: var(--accent);
    font-family: "Courier New", monospace;
    line-height: 1;
    animation: appear 0.6s ease-out;
  }
  
  @keyframes appear {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }
  
  .divider {
    font-size: 40px;
    color: var(--text-sub);
  }
  
  .info {
    border-top: 1px solid var(--border);
    padding-top: 20px;
    margin-top: 20px;
    font-size: 14px;
    color: var(--text-sub);
    line-height: 1.8;
  }
  
  .info-row {
    display: flex;
    justify-content: space-between;
    padding: 4px 0;
  }
  
  .info-label {
    text-align: left;
  }
  
  .info-value {
    text-align: right;
    font-weight: 500;
    color: var(--text);
  }
  
  .status-ok { color: var(--success); }
  .status-warn { color: var(--warning); }
  .status-error { color: var(--accent); }
  
  .warning-box {
    background: rgba(243, 156, 18, 0.1);
    border: 1px solid var(--warning);
    border-radius: 12px;
    padding: 12px;
    margin-top: 15px;
    font-size: 13px;
    color: var(--warning);
    text-align: left;
  }
  
  .error-box {
    background: rgba(192, 57, 43, 0.1);
    border: 1px solid var(--accent);
    border-radius: 12px;
    padding: 12px;
    margin-top: 15px;
    font-size: 13px;
    color: var(--accent);
    text-align: left;
  }
  
  .footer {
    margin-top: 25px;
    font-size: 11px;
    color: var(--text-sub);
    opacity: 0.7;
  }
</style>
</head>
<body>
<div class="container">
  <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙</button>
  
  <h1>Kết quả hôm nay</h1>
  
  <div class="numbers">
    <div class="number" id="so1">--</div>
    <div class="divider">─</div>
    <div class="number" id="so2">--</div>
  </div>
  
  <div class="info">
    <div class="info-row">
      <span class="info-label">📅 Dữ liệu ngày</span>
      <span class="info-value" id="ngayDuLieu">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">🎯 Chơi cho ngày</span>
      <span class="info-value" id="ngayChoi">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">🕐 Cập nhật lúc</span>
      <span class="info-value" id="timestamp">--</span>
    </div>
    <div class="info-row">
      <span class="info-label">✅ Trạng thái</span>
      <span class="info-value status-ok" id="trangThai">Bình thường</span>
    </div>
  </div>
  
  <div id="canhBao"></div>
  
  <div class="footer">
    ⚠️ Chỉ mang tính tham khảo giải trí. Không đảm bảo trúng thưởng.
  </div>
</div>

<script>
  const DATA = {"loi":[],"ngayDuLieu":"2026-10-11T00:00:00.000","ngayChoi":"2026-10-12","dacBiet":"7363","giaiNhat":"","ketQuaKeToan":{"kt01":"Đề + Nhất = 10 chữ số","kt02":"Tổng = 19","kt03":"TB = 4.75","kt04":"Chẵn 1 / Lẻ 3","kt05":"Tổng đề = 9","kt06":"Hiệu đề = 3","kt07":"Tổng nhất = NaN","kt08":"Đầu 6 / Đuôi 3","kt09":"7581 ngày","kt10":"Tần suất: 2:1 10:81 11:74 12:68 13:69 14:70 15:86 "},"ketQuaTongHop":{"th01":"Đầu 6 (796 lần)","th02":"Đuôi 6 (790 lần)","th03":"Không có","th04":"2, 98, 58, 56, 31","th05":"84-48 58-85 14-41 63-36 52-25","th06":"3774 ngày: 2026-10-08T00:00:00.000, 2026-10-09T00:00:00.000, 2026-10-10T00:00:00.000","th07":"3807 ngày: 2026-10-06T00:00:00.000, 2026-10-11T00:00:00.000, 2026-10-12T00:00:00.000","th08":"Đầu 9 lặp 2005-10-09T00:00:00.000 → 2005-10-10T00:00:00.000","th09":"Không có ngày trùng","th10":"53 → 63 → 87"},"ketQuaXoSo":{"xs01":"98 89","xs02":"98 89","xs03":"33 14","xs04":"?? ??","xs05":"9 4","xs06":"3 8","xs07":"63 36","xs08":"?? ??","xs09":"2 98","xs10":"99 56"},"final":["98","89"]};
  
  document.getElementById("so1").textContent = DATA.final[0];
  document.getElementById("so2").textContent = DATA.final[1];
  document.getElementById("ngayDuLieu").textContent = DATA.ngayDuLieu || "--";
  document.getElementById("ngayChoi").textContent = DATA.ngayChoi || "--";
  document.getElementById("timestamp").textContent = new Date().toLocaleString("vi-VN");
  
  // Kiểm tra cảnh báo
  const canhBaoEl = document.getElementById("canhBao");
  const trangThaiEl = document.getElementById("trangThai");
  
  if (DATA.loi && DATA.loi.length > 0) {
    trangThaiEl.textContent = "Có cảnh báo";
    trangThaiEl.className = "info-value status-warn";
    canhBaoEl.innerHTML = '<div class="warning-box">⚠️ ' + DATA.loi.join("<br>⚠️ ") + '</div>';
  }
  
  if (!DATA.final || DATA.final[0] === "??") {
    trangThaiEl.textContent = "Lỗi";
    trangThaiEl.className = "info-value status-error";
    canhBaoEl.innerHTML = '<div class="error-box">❌ Không thể tính toán kết quả. Vui lòng thử lại sau.</div>';
  }
  
  // Dark/Light mode
  function toggleTheme() {
    const html = document.documentElement;
    const current = html.getAttribute("data-theme");
    const next = current === "dark" ? "light" : "dark";
    html.setAttribute("data-theme", next);
    document.getElementById("themeBtn").textContent = next === "dark" ? "☀️" : "🌙";
    localStorage.setItem("theme", next);
  }
  
  // Load theme đã lưu
  const savedTheme = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme", savedTheme);
  document.getElementById("themeBtn").textContent = savedTheme === "dark" ? "☀️" : "🌙";
</script>
</body>
</html>
